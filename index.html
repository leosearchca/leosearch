<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeoSearch — Coming Soon</title>
<meta name="description" content="LeoSearch — the voice-first search engine. Just ask LEO. Coming soon.">
<link rel="icon" type="image/png" href="leo-logo.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background:#150E19; color:#ffffff;
    min-height:100vh; display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  main {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:48px 20px 32px;
  }
  .logo { width:250px; height:auto; display:block; }
  h1 {
    margin-top:30px; font-size:40px; font-weight:700; color:#ffffff;
    letter-spacing:12px; text-indent:12px; text-transform:uppercase; white-space:nowrap;
  }
  .tagline { margin-top:16px; font-size:17px; color:#b8b2c4; letter-spacing:.2px; }
  .tagline strong { color:#45c8ff; font-weight:700; }

  .lockups {
    margin-top:52px; padding-top:42px; border-top:1px solid #2b2136;
    display:flex; gap:56px; align-items:flex-start; justify-content:center; flex-wrap:wrap;
  }
  .lockups img { width:218px; height:auto; display:block; }
  @media (max-width:560px){
    h1 { font-size:27px; letter-spacing:8px; text-indent:8px; }
    .logo { width:190px; }
    .lockups { gap:30px; }
    .lockups img { width:158px; }
  }
  footer {
    padding:18px 20px 22px; text-align:center;
    font-size:13px; color:#7d7392;
  }
</style>
</head>
<body>
<main>
  <img class="logo" src="leo-logo.png" alt="LeoSearch logo">
  <h1>Coming Soon</h1>
  <p class="tagline">Just ask <strong>LEO</strong>.</p>

  <div class="lockups">
    <img src="lockup-search.png" alt="LeoSearch">
    <img src="lockup-mail.png" alt="LeoMail">
  </div>
</main>
<footer>© 2026 LeoSearch · Vancouver, BC · #GoAskLEO</footer>
</body>
</html>
