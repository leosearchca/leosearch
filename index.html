<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeoSearch — Search Leo</title>
<meta name="description" content="LeoSearch — the voice-first search engine. Search Leo.">
<link rel="icon" type="image/png" href="leo-logo.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background:#150E19; color:#ffffff;
    min-height:100vh; display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  main {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:48px 20px 32px;
  }
  .logo { width:280px; height:auto; display:block; }
  .slogan { width:270px; max-width:80vw; height:auto; display:block; margin-top:22px; }

  @media (max-width:560px){
    .logo { width:210px; }
    .slogan { width:215px; }
  }
  footer {
    padding:18px 20px 22px; text-align:center;
    font-size:13px; color:#7d7392;
  }
</style>
</head>
<body>
<main>
  <img class="logo" src="leo-logo.png" alt="LeoSearch logo">
  <img class="slogan" src="slogan-simple-circle-anim.webp" alt="#searchLeo....">
</main>
<footer>© 2026 LeoSearch</footer>
</body>
</html>
