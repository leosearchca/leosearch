<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeoSearch — Search Leo</title>
<meta name="description" content="LeoSearch is the world's first voice-only search engine. No keyboard. No mouse. You speak, LEO answers and shows you everything you asked. #searchLeo">
<link rel="canonical" href="https://leosearch.ca/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="LeoSearch">
<meta property="og:title" content="LeoSearch — Search Leo.">
<meta property="og:description" content="The world's first voice-only search engine. No keyboard. No mouse. You speak, LEO answers.">
<meta property="og:url" content="https://leosearch.ca/">
<meta property="og:image" content="https://leosearch.ca/leo-logo.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="LeoSearch — Search Leo.">
<meta name="twitter:description" content="The world's first voice-only search engine. No keyboard. No mouse. You speak, LEO answers.">
<meta name="twitter:image" content="https://leosearch.ca/leo-logo.png">
<link rel="icon" type="image/png" href="leo-logo.png">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "LeoSearch",
  "alternateName": "#searchLeo",
  "url": "https://leosearch.ca/",
  "description": "LeoSearch is the world's first voice-only search engine. No keyboard. No mouse. You speak, LEO answers and shows you everything you asked.",
  "slogan": "Search Leo.",
  "publisher": {
    "@type": "Organization",
    "name": "LeoSearch",
    "url": "https://leosearch.ca/",
    "logo": "https://leosearch.ca/leo-logo.png"
  }
}
</script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background:#150E19; color:#ffffff;
    min-height:100vh; display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  main {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:48px 20px 32px;
  }
  .logo { width:280px; height:auto; display:block; }

  .searchbar {
    position:relative;
    margin-top:38px; width:min(584px, 92vw); height:58px;
    background:#2b2833; border:1px solid #3a3646; border-radius:999px;
    display:flex; align-items:center; padding:0 10px 0 26px; gap:6px;
    box-shadow:0 6px 24px rgba(0,0,0,.45);
    transition:border-color .2s, box-shadow .2s, background .2s;
  }
  .searchbar:focus-within, .searchbar:hover {
    background:#322e3d; border-color:#4a445e;
    box-shadow:0 8px 30px rgba(0,0,0,.55);
  }
  .searchbar input {
    flex:1; min-width:0; background:transparent; border:none; outline:none;
    color:#f1eef7; font-size:19px; font-family:inherit; height:100%;
  }
  .searchbar input::placeholder { color:#9b94ab; }
  .bar-slogan {
    position:absolute; left:24px; top:50%; transform:translateY(-50%);
    height:31px; width:auto; display:block; pointer-events:none;
    transition:opacity .18s ease;
  }
  .searchbar.typing .bar-slogan { opacity:0; }
  .icon-btn {
    flex:none; width:44px; height:44px; border-radius:50%;
    background:transparent; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .2s;
  }
  .icon-btn:hover { background:rgba(255,255,255,.08); }
  .icon-btn svg { width:25px; height:25px; fill:#e9e6f2; display:block; }
  .icon-btn.listening { background:rgba(110,168,255,.18); animation:pulse 1.1s ease-in-out infinite; }
  .icon-btn.listening svg { fill:#8ab8ff; }
  @keyframes pulse {
    0%,100% { box-shadow:0 0 0 0 rgba(110,168,255,.45); }
    50% { box-shadow:0 0 0 9px rgba(110,168,255,0); }
  }
  .search-status {
    margin-top:16px; min-height:20px; max-width:min(584px, 92vw);
    font-size:14.5px; line-height:1.45; color:#b7aed0;
  }
  .search-status b { color:#e9e6f2; font-weight:600; }

  @media (max-width:560px){
    .logo { width:210px; }
    .searchbar { height:54px; padding-left:20px; margin-top:32px; }
    .searchbar input { font-size:17px; }
    .bar-slogan { left:20px; height:27px; }
  }
  footer {
    padding:18px 20px 22px; text-align:center;
    font-size:13px; color:#7d7392;
  }
</style>
</head>
<body>
<main>
  <img class="logo" src="leo-logo.png" alt="LeoSearch logo">
  <form class="searchbar" id="searchForm" role="search" autocomplete="off">
    <img class="bar-slogan" src="slogan-simple-circle-anim.webp" alt="#searchLeo....">
    <input id="searchInput" type="text" aria-label="Search" enterkeyhint="search">
    <button class="icon-btn" id="micBtn" type="button" aria-label="Search by voice" title="Search by voice">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5.91-3a.9.9 0 0 0-1.8 0A4.09 4.09 0 0 1 12 16.09a4.09 4.09 0 0 1-4.11-4.09.9.9 0 1 0-1.8 0A5.89 5.89 0 0 0 11.1 17.82V20H8.4a.9.9 0 1 0 0 1.8h7.2a.9.9 0 1 0 0-1.8h-2.7v-2.18A5.89 5.89 0 0 0 17.91 12z"/></svg>
    </button>
    <button class="icon-btn" id="lensBtn" type="button" aria-label="Search by image" title="Search by image">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2A3.2 3.2 0 1 1 12 8.8a3.2 3.2 0 0 1 0 6.4zM19.7 3.5a1.75 1.75 0 1 1 0 3.5 1.75 1.75 0 0 1 0-3.5zM6.55 2.6h2.9a.95.95 0 0 1 0 1.9H7.5a3 3 0 0 0-3 3v1.95a.95.95 0 0 1-1.9 0V7.5c0-2.7 1.2-4.9 3.95-4.9zm10.9 18.8h-2.9a.95.95 0 0 1 0-1.9h1.95a3 3 0 0 0 3-3v-1.95a.95.95 0 0 1 1.9 0V16.5c0 2.7-1.2 4.9-3.95 4.9zm-10.9 0c-2.75 0-3.95-2.2-3.95-4.9V15a.95.95 0 0 1 1.9 0v1.5a3 3 0 0 0 3 3h1.95a.95.95 0 0 1 0 1.9H6.55zm10.9-18.8c2.75 0 3.95 2.2 3.95 4.9v1.5a.95.95 0 0 1-1.9 0V7.5a3 3 0 0 0-3-3h-1.95a.95.95 0 0 1 0-1.9h2.9z"/></svg>
    </button>
  </form>
  <p class="search-status" id="searchStatus" aria-live="polite"></p>
</main>
<footer>© 2026 LeoSearch</footer>
<script>
(function(){
  var form = document.getElementById('searchForm');
  var input = document.getElementById('searchInput');
  var status = document.getElementById('searchStatus');
  var micBtn = document.getElementById('micBtn');
  var lensBtn = document.getElementById('lensBtn');

  function syncSlogan(){
    var hide = document.activeElement === input || input.value.length > 0;
    form.classList.toggle('typing', hide);
  }
  input.addEventListener('focus', syncSlogan);
  input.addEventListener('blur', syncSlogan);
  input.addEventListener('input', syncSlogan);

  function say(html){ status.innerHTML = html; }
  function esc(s){ return s.replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function submitSearch(){
    var q = input.value.trim();
    if(!q){ say('Tap the mic and say it — or type, then hit enter.'); input.focus(); return; }
    say('You\'re early, Leo fan. Full search launches soon — and <b>&ldquo;' + esc(q) + '&rdquo;</b> is exactly the kind of thing LEO will answer out loud.');
  }

  form.addEventListener('submit', function(e){ e.preventDefault(); submitSearch(); });

  lensBtn.addEventListener('click', function(){
    say('Image search is coming soon. For now, tap the mic and just say it.');
  });

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var listening = false, recog = null;
  micBtn.addEventListener('click', function(){
    if(listening && recog){ recog.stop(); return; }
    if(!SR){ say('Voice search needs Chrome or Edge on this device — typing works everywhere.'); input.focus(); return; }
    recog = new SR();
    recog.lang = 'en-CA';
    recog.interimResults = true;
    recog.maxAlternatives = 1;
    recog.onstart = function(){
      listening = true; micBtn.classList.add('listening');
      say('Listening… say it.');
    };
    recog.onresult = function(ev){
      var txt = '';
      for(var i = 0; i < ev.results.length; i++){ txt += ev.results[i][0].transcript; }
      input.value = txt; syncSlogan();
      if(ev.results[ev.results.length - 1].isFinal){ submitSearch(); }
    };
    recog.onerror = function(ev){
      if(ev.error === 'not-allowed' || ev.error === 'service-not-allowed'){
        say('The mic is blocked — allow microphone access for leosearch.ca and tap the mic again.');
      } else if(ev.error !== 'aborted'){
        say('Didn\'t catch that — tap the mic and try again.');
      }
    };
    recog.onend = function(){
      listening = false; micBtn.classList.remove('listening');
      syncSlogan();
    };
    try { recog.start(); } catch(e) { /* already running */ }
  });
})();
</script>
</body>
</html>
