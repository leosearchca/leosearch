<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeoSearch — Search Leo</title>
<meta name="description" content="LeoSearch — the voice-first search engine. Search Leo.">
<link rel="icon" type="image/png" href="leo-logo.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background:#150E19; color:#ffffff;
    min-height:100vh; display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  main {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:48px 20px 32px;
  }
  .logo { width:280px; height:auto; display:block; }
  .tagline { margin-top:28px; font-size:19px; color:#b8b2c4; letter-spacing:.2px; }
  .tagline strong { color:#45c8ff; font-weight:700; }
  .search-word { font-weight:700; color:#ffffff; }
  .big-s { font-size:1.55em; font-weight:700; line-height:0; }
  .big-l { font-size:1.55em; font-weight:700; line-height:0; }

  @media (max-width:560px){
    .logo { width:210px; }
  }
  footer {
    padding:18px 20px 22px; text-align:center;
    font-size:13px; color:#7d7392;
  }
</style>
</head>
<body>
<main>
  <img class="logo" src="leo-logo.png" alt="LeoSearch logo">
  <p class="tagline"><span class="search-word"><span class="big-s">S</span>earch</span> <strong><span class="big-l">L</span>eo</strong>.</p>
</main>
<footer>© 2026 LeoSearch</footer>
</body>
</html>
