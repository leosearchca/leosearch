<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeoSearch — Coming Soon</title>
<meta name="description" content="LeoSearch — the voice-first search engine. Just ask LEO. Coming soon.">
<link rel="icon" type="image/png" href="leo-logo.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background:#ffffff; color:#202124;
    min-height:100vh; display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  main {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:48px 20px 32px;
  }
  .logo { width:176px; height:auto; display:block; }
  h1 {
    margin-top:34px; font-size:34px; font-weight:300; color:#202124;
    letter-spacing:14px; text-indent:14px; text-transform:uppercase; white-space:nowrap;
  }
  .tagline { margin-top:16px; font-size:17px; color:#5f6368; letter-spacing:.2px; }
  .tagline strong { color:#0b57d0; font-weight:700; }

  .lockups {
    margin-top:54px; padding-top:40px; border-top:1px solid #e8eaed;
    display:flex; gap:56px; align-items:flex-start; justify-content:center; flex-wrap:wrap;
  }
  .lockups img { width:188px; height:auto; display:block; }
  @media (max-width:560px){
    h1 { font-size:24px; letter-spacing:9px; text-indent:9px; }
    .logo { width:138px; }
    .lockups { gap:32px; }
    .lockups img { width:148px; }
  }
  footer {
    padding:18px 20px 22px; text-align:center;
    font-size:13px; color:#80868b;
  }
</style>
</head>
<body>
<main>
  <img class="logo" src="leo-logo.png" alt="LeoSearch logo">
  <h1>Coming Soon</h1>
  <p class="tagline">Just ask <strong>LEO</strong>.</p>

  <div class="lockups">
    <img src="lockup-search.png" alt="LeoSearch">
    <img src="lockup-mail.png" alt="LeoMail">
  </div>
</main>
<footer>© 2026 LeoSearch · Vancouver, BC · #GoAskLEO</footer>
</body>
</html>
